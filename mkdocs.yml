site_name: Curso Preparatório SAPE/SC 2026
site_description: Plataforma editorial do curso preparatório para o concurso SAPE/SC
site_author: Equipe do Curso SAPE/SC
site_url: https://curso-sape-sc-2026.pages.dev/
repo_name: vmedinax/curso-sape-sc-2026
repo_url: https://github.com/vmedinax/curso-sape-sc-2026
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: pt-BR
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Usar tema claro

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: Nesta página
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Página inicial: index.md
  - Mapa do curso: MAPA_DO_CURSO.md
  - Guia do candidato:
      - Módulo 1 • Orientação inicial:
          - Aula 1 • Como usar este curso: 00-guia-do-candidato/01-como-usar-este-curso.md
  - Disciplinas:
      - Língua Portuguesa:
          - Módulo 1 • Em preparação:
              - Aula 1 • Apresentação da disciplina: 01-portugues/index.md
      - Raciocínio Lógico:
          - Módulo 1 • Em preparação:
              - Aula 1 • Apresentação da disciplina: 02-raciocinio-logico/index.md
      - Legislação e Ética na Administração Pública:
          - Módulo 1 • Em preparação:
              - Aula 1 • Apresentação da disciplina: 10-legislacao/index.md
      - Administração Geral e Gestão Organizacional:
          - Módulo 0 • Conheça a disciplina:
              - Aula 1 • Visão geral: 03-administracao-geral/index.md
              - Aula 2 • Plano da disciplina: 03-administracao-geral/PLANO_DA_DISCIPLINA.md
          - Módulo 1 • Fundamentos da Administração Pública:
              - Aula 1 • Princípios da Administração Pública: 03-administracao-geral/01-principios-da-administracao-publica.md
              - Aula 2 • Organização administrativa e regime jurídico: 03-administracao-geral/02-organizacao-administrativa-e-regime-juridico.md
              - Aula 3 • Administração direta e indireta: 03-administracao-geral/03-administracao-direta-e-indireta.md
              - Aula 4 • Administração Pública de Santa Catarina: 03-administracao-geral/04-administracao-publica-de-santa-catarina.md
              - Aula 5 • Competências dos órgãos e entidades: 03-administracao-geral/05-competencias-dos-orgaos-e-entidades.md
      - Administração Financeira e Orçamentária:
          - Módulo 1 • Em preparação:
              - Aula 1 • Apresentação da disciplina: 07-afo/index.md
      - Políticas Públicas para o Desenvolvimento Rural e Agropecuário:
          - Módulo 1 • Em preparação:
              - Aula 1 • Apresentação da disciplina: 11-conhecimentos-especificos/index.md

